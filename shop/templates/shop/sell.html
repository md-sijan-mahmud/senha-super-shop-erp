<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>পণ্য বিক্রি</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
    <div class="container" style="max-width: 500px;">
        <div class="bg-white p-4 rounded shadow-sm">
            <h1 class="h3 text-success fw-bold mb-4">পণ্য বিক্রি এন্ট্রি</h1>
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-bold">পণ্য সিলেক্ট করুন:</label>
                    <select name="product_id" class="form-select">
                        {% for p in products %}
                            <option value="{{ p.id }}">{{ p.name }} (স্টক: {{ p.stock_quantity }}) - ৳{{ p.sell_price }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">পরিমাণ (Quantity):</label>
                    <input type="number" name="quantity" value="1" min="1" class="form-control">
                </div>
                <button type="submit" class="btn btn-primary w-100 fw-bold">বিক্রি সম্পন্ন করুন</button>
            </form>
            <div class="mt-3">
                <a href="{% url 'dashboard' %}" class="text-decoration-none">← ড্যাশবোর্ডে ফিরে যান</a>
            </div>
        </div>
    </div>
</body>
</html>
