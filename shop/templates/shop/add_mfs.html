{% extends 'shop/base.html' %}
{% block content %}
<div style="max-width: 500px;">
    <h3 class="text-success fw-bold mb-3"><i class="fa-solid fa-wallet"></i> মোবাইল ব্যাংকিং (বিকাশ/নগদ) হিসাব</h3>
    <form method="POST">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label fw-bold">লেনদেনের ধরণ / বিবরণ:</label>
            <input type="text" name="mfs_type" class="form-control" required placeholder="যেমন: বিকাশ ক্যাশআউট কমিশন">
        </div>
        <div class="mb-3">
            <label class="form-label fw-bold">লেনদেনের পরিমাণ:</label>
            <input type="number" step="0.01" name="amount" class="form-control" required placeholder="৳">
        </div>
        <div class="mb-3">
            <label class="form-label fw-bold">কমিশন বা লাভ কত হলো?</label>
            <input type="number" step="0.01" name="profit" class="form-control" required placeholder="৳">
        </div>
        <button type="submit" class="btn btn-success w-100 fw-bold py-2">এমএফএস আয় সেভ করুন</button>
    </form>
</div>
{% endblock %}
