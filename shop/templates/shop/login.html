{% extends 'shop/base.html' %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card shadow p-4">
            <h3 class="text-center text-primary mb-3 fw-bold">ক্যাশ কাউন্টার লগইন</h3>
            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary w-100 fw-bold">লগইন করুন</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
