{% extends 'shop/base.html' %}
{% block content %}
<div style="max-width: 500px;">
    <h3 class="text-danger fw-bold mb-3"><i class="fa-solid fa-receipt"></i> দোকান খরচ এন্ট্রি</h3>
    <form method="POST">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label fw-bold">খরচের খাত (যেমন: বিদ্যুৎ বিল):</label>
            <input type="text" name="title" class="form-control" required placeholder="খাতের নাম">
        </div>
        <div class="mb-3">
            <label class="form-label fw-bold">টাকার পরিমাণ:</label>
            <input type="number" step="0.01" name="amount" class="form-control" required placeholder="৳">
        </div>
        <button type="submit" class="btn btn-danger w-100 fw-bold py-2">খরচ সেভ করুন</button>
    </form>
</div>
{% endblock %}
