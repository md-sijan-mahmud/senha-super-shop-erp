{% extends 'shop/base.html' %}
{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow p-4">
                <h3 class="text-primary mb-3">লেনদেন এডিট করুন</h3>
                <form method="POST">
                    {% csrf_token>
                    
                    {% if transaction.trans_type == 'Sale' %}
                        <div class="mb-3">
                            <label class="fw-bold">পণ্যের নাম:</label>
                            <input type="text" class="form-control" value="{% if transaction.product %}{{ transaction.product.name }}{% endif %}" disabled>
                        </div>
                        <div class="mb-3">
                            <label class="fw-bold">পরিমাণ (Quantity):</label>
                            <input type="number" name="quantity" value="{{ transaction.quantity }}" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="fw-bold">মোট ক্রয়মূল্য:</label>
                            <input type="number" step="0.01" name="buy_price" value="{{ transaction.buy_price }}" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="fw-bold">মোট বিক্রয়মূল্য:</label>
                            <input type="number" step="0.01" name="amount" value="{{ transaction.amount }}" class="form-control" required>
                        </div>
                    {% else %}
                        <div class="mb-3">
                            <label class="fw-bold">সেবা বা খাতের নাম:</label>
                            <input type="text" name="service_name" value="{{ transaction.service_name }}" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="fw-bold">টাকার পরিমাণ:</label>
                            <input type="number" step="0.01" name="amount" value="{{ transaction.amount }}" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="fw-bold">লাভের পরিমাণ:</label>
                            <input type="number" step="0.01" name="profit" value="{{ transaction.profit }}" class="form-control" required>
                        </div>
                    {% endif %}
                    
                    <div class="d-flex justify-content-between">
                        <a href="{% url 'dashboard' %}" class="btn btn-secondary">বাতিল</a>
                        <button type="submit" class="btn btn-success">আপডেট করুন</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
