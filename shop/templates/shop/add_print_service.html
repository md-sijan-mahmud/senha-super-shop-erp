{% extends 'shop/base.html' %}
{% block content %}
<div style="max-width: 500px;">
    <h3 class="text-primary fw-bold mb-3"><i class="fa-solid fa-print"></i> মগ ও কম্পিউটার প্রিন্ট সার্ভিস</h3>
    <form method="POST">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label fw-bold">কাজের বিবরণ (যেমন: মগ প্রিন্ট):</label>
            <input type="text" name="service_name" class="form-control" required placeholder="বিবরণ লিখুন">
        </div>
        <div class="mb-3">
            <label class="form-label fw-bold">মোট কত টাকা নিলেন?</label>
            <input type="number" step="0.01" name="amount" class="form-control" required placeholder="৳">
        </div>
        <div class="mb-3">
            <label class="form-label fw-bold">এখান থেকে লাভ কত?</label>
            <input type="number" step="0.01" name="profit" class="form-control" required placeholder="৳">
        </div>
        <button type="submit" class="btn btn-primary w-100 fw-bold py-2">সার্ভিস আয় সেভ করুন</button>
    </form>
</div>
{% endblock %}
