<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>দোকান ম্যানেজমেন্ট সিস্টেম</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js লাইব্রেরি লিংক (গ্রাফ দেখানোর জন্য) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #f8f9fa; }
        .sidebar {
            min-height: 100vh;
            background-color: #212529;
            color: #fff;
            position: fixed;
            top: 0;
            left: 0;
            width: 260px;
            padding-top: 20px;
        }
        .sidebar a {
            color: #adb5bd;
            text-decoration: none;
            padding: 12px 20px;
            display: block;
            font-weight: 500;
            border-radius: 5px;
            margin: 4px 10px;
        }
        .sidebar a:hover {
            color: #fff;
            background-color: #0d6efd;
        }
        /* অ্যাক্টিভ বা সিলেক্টেড মেনুর স্টাইল */
        .sidebar a.active-menu {
            color: #fff;
            background-color: #0d6efd;
        }
        .main-content {
            margin-left: 260px;
            padding: 30px;
        }
        @media (max-width: 768px) {
            .sidebar { width: 100%; position: relative; min-height: auto; }
            .main-content { margin-left: 0; }
        }
    </style>
</head>
<body>

    <!-- বাম পাশের সাইডবার মেনু -->
    <div class="sidebar shadow">
        <h4 class="text-center text-warning fw-bold mb-4"><i class="fa-solid fa-shop"></i> ক্যাশ কাউন্টার</h4>
        <hr class="text-secondary">
        
        <a href="{% url 'dashboard' %}" class="{% if request.resolver_match.url_name == 'dashboard' %}active-menu{% endif %}">
            <i class="fa-solid fa-chart-pie me-2"></i> ড্যাশবোর্ড
        </a>
        
        <a href="{% url 'analytics_report' %}" class="{% if request.resolver_match.url_name == 'analytics_report' %}active-menu{% endif %}">
            <i class="fa-solid fa-chart-line me-2"></i> মাসিক ও বাৎসরিক রিপোর্ট
        </a>
        
        <a href="{% url 'make_sale' %}" class="{% if request.resolver_match.url_name == 'make_sale' %}active-menu{% endif %}">
            <i class="fa-solid fa-cart-shopping me-2"></i> পণ্য বিক্রি (Sell)
        </a>
        
        <a href="{% url 'add_print_service' %}" class="{% if request.resolver_match.url_name == 'add_print_service' %}active-menu{% endif %}">
            <i class="fa-solid fa-print me-2"></i> মগ ও প্রিন্ট সার্ভিস
        </a>
        
        <a href="{% url 'add_mfs' %}" class="{% if request.resolver_match.url_name == 'add_mfs' %}active-menu{% endif %}">
            <i class="fa-solid fa-wallet me-2"></i> মোবাইল ব্যাংকিং
        </a>
        
        <a href="{% url 'add_expense' %}" class="{% if request.resolver_match.url_name == 'add_expense' %}active-menu{% endif %}">
            <i class="fa-solid fa-receipt me-2"></i> দোকান খরচ এন্ট্রি
        </a>
        
        <a href="{% url 'stock_list' %}" class="{% if request.resolver_match.url_name == 'stock_list' %}active-menu{% endif %}">
            <i class="fa-solid fa-boxes-stacked me-2"></i> প্রোডাক্ট স্টক লিস্ট
        </a>
        
        <a href="{% url 'customer_list' %}" class="{% if request.resolver_match.url_name == 'customer_list' or request.resolver_match.url_name == 'customer_detail' %}active-menu{% endif %}">
            <i class="fa-solid fa-users me-2"></i> বাকি খাতা / কাস্টমার
        </a>
    </div>

    <!-- মূল পেজ কন্টেন্ট -->
    <div class="main-content">
        <div class="container-fluid bg-white p-4 rounded shadow-sm">
            {% block content %}{% endblock %}
        </div>
    </div>

</body>
</html>
